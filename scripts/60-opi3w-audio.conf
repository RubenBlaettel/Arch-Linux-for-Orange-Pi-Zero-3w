# Orange Pi Zero 3W: USB-C/DisplayPort ist die Standard-Tonausgabe, HDMI die zweite.
# Die HDMI-Karte meldet einen Aufnahmeeingang, an dem keine Quelle haengt.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*i2s4_mach.*" } ]
    actions = {
      update-props = {
        node.description = "USB-C / DisplayPort"
        node.nick = "USB-C"
        priority.driver = 1100
        priority.session = 1100
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.*i2s3_mach.*" } ]
    actions = {
      update-props = {
        node.description = "HDMI"
        node.nick = "HDMI"
        priority.driver = 1000
        priority.session = 1000
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_input.*i2s3_mach.*" } ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [ { device.name = "~alsa_card.*i2s4_mach.*" } ]
    actions = { update-props = { device.description = "USB-C / DisplayPort" } }
  }
  {
    matches = [ { device.name = "~alsa_card.*i2s3_mach.*" } ]
    actions = { update-props = { device.description = "HDMI" } }
  }
]
